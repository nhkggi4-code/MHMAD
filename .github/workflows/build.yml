name: Build APK

on:
  push:
    branches: [ "main", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip Project
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

    - name: Generate Gradlew & Build APK
      run: |
        BUILD_DIR=$(find . -name "build.gradle*" -printf "%h\n" | head -n 1)
        if [ -z "$BUILD_DIR" ]; then
          echo "ERROR: build.gradle file not found!"
          exit 1
        fi
        cd "$BUILD_DIR"
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-APK
        path: "**/build/outputs/apk/debug/*.apk"

