name: Build APK

on:
  push:
    branches: [ "main", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip & Prepare Clean Project
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          echo "ERROR: settings.gradle not found!"
          exit 1
        fi

        SRC_DIR=$(dirname "$SETTINGS_FILE")
        
        # نقل الملفات إلى مجلد مسار نظيف بدون مسافات أو حروف عربية
        mkdir -p project_clean
        cp -r "$SRC_DIR"/* project_clean/ 2>/dev/null || true
        cp -r "$SRC_DIR"/.* project_clean/ 2>/dev/null || true

    - name: Build APK (Fix BouncyCastle & Cache Lock)
      env:
        GRADLE_USER_HOME: ${{ github.workspace }}/.gradle_home
      run: |
        cd project_clean
        
        # إنشاء Wrapper إصدار 8.2
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        
        # بناء التطبيق مع تعطيل المعالجة المتوازية لمنع تعارض ملفات Jar
        ./gradlew assembleDebug \
          --no-daemon \
          --no-configuration-cache \
          -Dorg.gradle.parallel=false \
          -Dorg.gradle.vfs.watch=false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-APK
        path: "**/build/outputs/apk/debug/*.apk"
