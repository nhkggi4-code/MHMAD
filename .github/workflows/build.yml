name: Build APK

on:
  push:
    branches: [ "main", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip & Fix Directory
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          echo "ERROR: settings.gradle not found!"
          exit 1
        fi

        SRC_DIR=$(dirname "$SETTINGS_FILE")
        mkdir -p project_clean
        cp -r "$SRC_DIR"/* project_clean/ 2>/dev/null || true
        cp -r "$SRC_DIR"/.* project_clean/ 2>/dev/null || true

    - name: Clear Cache & Build APK
      run: |
        rm -rf ~/.gradle/caches/
        cd project_clean
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-APK
        path: "**/build/outputs/apk/debug/*.apk"
